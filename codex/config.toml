model = "gpt-6.1-sol"
model_reasoning_effort = "high"
approvals_reviewer = "auto_review"
service_tier = "default"

[tui]
status_line = ["model-with-reasoning", "current-dir", "git-branch", "context-used", "five-hour-limit", "weekly-limit"]
status_line_use_colors = true
screen_reader_detection_done = true

[desktop]
followUpQueueMode = "steer"
conversationDetailMode = "STEPS_PROSE"
ambient-suggestions-enabled = true
keepRemoteControlAwakeWhilePluggedIn = true
selected-avatar-id = "seedy"

[agents]
enabled = true
max_concurrent_threads_per_session = 4
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "medium"

# Direct agent selection replaces the previous Laya routing workflow.
[[skills.config]]
path = "/home/t3/.agents/skills/laya-route/SKILL.md"
enabled = false
